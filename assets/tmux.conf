# ~/.tmux.conf — схема: таб iTerm2 = обычный tmux-клиент (не -CC), prefix C-a

# === Claude Code / AI CLI ===
# Пробросить прикладные escape-последовательности (OSC 9/1337) до iTerm2
set -g allow-passthrough on
# Bell от Claude Code доходит до iTerm2 (алерты — Filter Alerts в профиле Default)
set -g bell-action any
set -g monitor-bell on
# extended-keys НЕ включать: ломает профильные ⌘←/⌘→ iTerm2 (Esc [1~/[4~ из фикса
# 24.08 перестают распознаваться — Esc глотается, «1~»/«4~» печатаются текстом).
# Проверено 01.09.2026. Shift+Enter работает через ручной bind ниже + GlobalKeyMap.
# set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'
bind-key -n S-Enter send-keys Escape "[13;2u"
# Focus-события для приложений — работает при FocusReportingEnabled=true в iTerm2
set -g focus-events on
# Пробросить TERM_PROGRAM в сессии — авто-детекция терминала в claude-notifications-go
set -ag update-environment "TERM_PROGRAM"
# Truecolor для Claude Code внутри tmux (действует на новые сессии)
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# === Заголовки и статус ===
# Window title для iTerm2/Timing.app: имя tmux-окна = тема сессии
# (ставит хук ~/.claude/hooks/_rename-apply.sh через rename-window)
set -g set-titles on
set -g set-titles-string "#{window_name}"
# Статус-бар tmux не нужен: таб iTerm2 = сессия
set -g status off

# === Буфер и ввод ===
# Scrollback — Claude Code генерирует тысячи строк
set -g history-limit 50000
set -g mouse on

# === Prefix ===
set -g prefix C-a
unbind C-b
# C-a C-a — отправить сам C-a в программу (начало строки в шелле)
bind C-a send-prefix

# === Mobile (iPhone via Termius) ===
set -g display-time 3000
set -g display-panes-time 3000
