# CI for jadlis-claudecode: plugin validate --strict, gitleaks over the full history,
# README parity and privacy grep. Port of the hub's reusable plugin-ci.yml (2026-11-04 move
# to GitHub; beCyborg since 2026-11-06); the two doc tools are vendored in tools/ci/ so the repo stands alone.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CLAUDE_CLI_VERSION: "2.1.263"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install claude CLI (self-healing)
        shell: bash
        run: |
          set -euo pipefail
          PKG="@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          pkg_root() { echo "$(npm root -g 2>/dev/null || true)/@anthropic-ai/claude-code"; }
          ok=""
          for attempt in 1 2 3; do
            timeout -k 10 300 npm install -g --include=optional "$PKG" || echo "npm install attempt ${attempt} failed"
            if claude --version 2>/dev/null; then ok=1; break; fi
            root="$(pkg_root)"
            [[ -f "$root/install.cjs" ]] && timeout -k 10 300 node "$root/install.cjs" || true
            if claude --version 2>/dev/null; then ok=1; break; fi
            [[ "$attempt" -lt 3 ]] && sleep $((attempt * 10))
          done
          [[ -n "$ok" ]] || { echo "::error::claude CLI did not become usable after 3 attempts" >&2; exit 1; }
      - name: claude plugin validate --strict
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned CLI, full history)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --no-banner --exit-code 1 --redact
          rm -f gitleaks

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: README parity (H2 sets, links; Mermaid forbidden in README)
        run: |
          if grep -rl --include='README*.md' '```mermaid' . ; then
            echo "::error::Mermaid fences are not allowed in README (images only)"; exit 1
          fi
          python3 tools/ci/readme-parity.py --no-mermaid --allow-missing-en .
      - name: privacy grep
        run: python3 tools/ci/privacy-grep.py .
